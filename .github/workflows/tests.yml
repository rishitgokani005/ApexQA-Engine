name: ApexQA-Engine CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Nightly regression run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-execution:
    name: Run Tests (${{ matrix.browser }} / Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        browser: [chromium, firefox]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Cache Playwright Browser Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install ${{ matrix.browser }} --with-deps

      - name: Execute Pytest Suite (UI & API)
        env:
          BASE_URL: https://www.saucedemo.com
          API_BASE_URL: https://reqres.in/api
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          pytest --browser ${{ matrix.browser }} --alluredir=allure-results -n auto

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: allure-results
          retention-days: 7

  publish-report-and-notify:
    name: Generate Allure Report & Dispatch Notifications
    needs: test-execution
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: merged-allure-results

      - name: Consolidate Allure Results
        run: |
          mkdir -p allure-results
          find merged-allure-results -type f -exec cp {} allure-results/ \;

      - name: Get Allure Report History (gh-pages)
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Prepare Allure History
        run: |
          if [ -d "gh-pages-branch/history" ]; then
            cp -r gh-pages-branch/history allure-results/history
          fi

      - name: Install Allure CLI & Build Report
        run: |
          sudo apt-get update && sudo apt-get install -y default-jre
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: false

      - name: Compute Real Test Result Counts
        id: counts
        run: |
          python -c "
          import json, glob
          total = passed = failed = skipped = 0
          for f in glob.glob('allure-results/*-result.json'):
              with open(f) as fh:
                  data = json.load(fh)
              status = data.get('status', '')
              total += 1
              if status == 'passed':
                  passed += 1
              elif status in ('failed', 'broken'):
                  failed += 1
              elif status == 'skipped':
                  skipped += 1
          print(f'total={total}')
          print(f'passed={passed}')
          print(f'failed={failed}')
          print(f'skipped={skipped}')
          " >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ALLURE_REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python utils/slack_notifier.py "${{ needs.test-execution.result }}" ${{ steps.counts.outputs.total }} ${{ steps.counts.outputs.passed }} ${{ steps.counts.outputs.failed }} ${{ steps.counts.outputs.skipped }} 0
