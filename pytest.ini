[pytest]
testpaths = tests
addopts = 
    -v
    --alluredir=allure-results
    --html=report.html
    --self-contained-html
    --clean-alluredir
    --tb=short
markers =
    ui: UI automation tests using Playwright
    api: API integration tests using Requests
    smoke: Smoke test suite for quick validation
    regression: Full regression test suite
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
